[workspace]
members = [".", "src-tauri"]

[package]
name = "tracker"
version = "0.1.0"
edition = "2024"

[lib]
name = "tracker"
path = "src/lib.rs"

[[bin]]
name = "tracker"
path = "src/main.rs"

[profile.dev]
debug = 1

[dependencies]
directories = "5"
display-info = "0.5.9"
rust-i18n = "3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
starship-battery = "0.11.0"
sysinfo = "0.39.5"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
wmi = "0.18.4"
