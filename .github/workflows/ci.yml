name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances système Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: cargo tauri build
        # Le CLI Tauri cherche `src-tauri` dans les sous-dossiers du répertoire
        # courant : il faut donc l'exécuter depuis la racine du dépôt (via
        # --prefix), pas depuis `frontend/` (dossier frère, pas parent).
        run: npx --prefix frontend tauri build
